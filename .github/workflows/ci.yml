name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build:aws
        env:
          NEXT_PUBLIC_API_URL: ""

  backend:
    name: Backend lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sentellent_test
          POSTGRES_USER: sentellent_test
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentellent_test -d sentellent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      AUTH_MODE: demo
      DEMO_USER_ID: 00000000-0000-0000-0000-000000000001
      DATABASE_URL: postgresql+asyncpg://sentellent_test:ci-${{ github.run_id }}@localhost:5432/sentellent_test
      TEST_DATABASE_URL: postgresql+asyncpg://sentellent_test:ci-${{ github.run_id }}@localhost:5432/sentellent_test
      SESSION_SECRET: ci-only-session-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
        working-directory: backend
      - name: Audit backend dependencies
        run: pip-audit --requirement requirements.txt
        working-directory: backend
      - name: Migrate pgvector integration database
        run: alembic upgrade head
        working-directory: backend
      - name: Ruff
        run: ruff check .
        working-directory: backend
      - name: Mypy
        run: mypy app
        working-directory: backend
      - name: Pytest with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80
        working-directory: backend
        env:
          # Most tests remain isolated in memory; the dedicated SQL test uses
          # TEST_DATABASE_URL against the migrated pgvector service.
          DATABASE_URL: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  e2e:
    name: Critical browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical end-to-end flows
        run: npm run test:e2e

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate application stack
        run: terraform init -backend=false && terraform validate
        working-directory: infra
      - name: Validate bootstrap stack
        run: terraform init -backend=false && terraform validate
        working-directory: infra/bootstrap

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
